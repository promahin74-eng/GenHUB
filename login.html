<link rel="manifest" href="/manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg1: #0f1020;
    --bg2: #1a1530;
    --card: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.14);
    --label: #f5f5f7;
    --label2: #a1a1ab;
    --blue: #0a84ff;
    --blue2: #64d2ff;
    --sep: rgba(255,255,255,0.10);
    --red: #ff453a;
  }

  html, body {
    height: 100%;
    background: var(--bg1);
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
  }

  /* Layered ambient mesh background */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 15%, rgba(10,132,255,0.28), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(175,82,222,0.22), transparent 45%),
      radial-gradient(circle at 75% 85%, rgba(48,209,88,0.16), transparent 50%),
      radial-gradient(circle at 20% 90%, rgba(255,159,10,0.14), transparent 45%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    z-index: 0;
    animation: mesh-drift 18s ease-in-out infinite alternate;
  }
  @keyframes mesh-drift {
    0%   { filter: hue-rotate(0deg) brightness(1); }
    100% { filter: hue-rotate(12deg) brightness(1.08); }
  }
  /* subtle grain */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
  }

  /* ══════════ ORBIT SYSTEM ══════════ */
  .orbit-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin-bottom: 6px;
    z-index: 1;
  }

  /* faint guide rings */
  .orbit-ring {
    position: absolute;
    top: 50%; left: 50%;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .ring-1 { width: 200px; height: 200px; }
  .ring-2 { width: 260px; height: 260px; border-style: dashed; opacity: 0.5; }

  /* rotating carriers — the icons sit on these and spin slowly, kept upright */
  .orbit {
    position: absolute;
    inset: 0;
    animation: spin 26s linear infinite;
  }
  .orbit.reverse { animation-direction: reverse; animation-duration: 34s; }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

  .orbit-icon {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    backdrop-filter: blur(6px);
    box-shadow: 0 6px 22px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.25);
    animation: spin-rev 26s linear infinite, pop-in 0.6s cubic-bezier(.34,1.56,.64,1) both;
  }
  .orbit.reverse .orbit-icon { animation: spin 34s linear infinite, pop-in 0.6s cubic-bezier(.34,1.56,.64,1) both; }

  @keyframes pop-in {
    from { opacity: 0; transform: scale(0.3); }
    to   { opacity: 1; transform: scale(1); }
  }

  .orbit-icon svg { width: 20px; height: 20px; }

  /* Positions around ring-1 (radius 100px) */
  .o1 { top: 0;    left: 50%; margin-left: -20px; width: 40px; height: 40px; background: linear-gradient(145deg,#1c1c1e,#3a3a3c); }
  .o2 { top: 29.3%; left: 90.5%; margin-left: -19px; margin-top: -19px; width: 38px; height: 38px; background: rgba(255,255,255,0.95); }
  .o3 { top: 79.3%; left: 90.5%; margin-left: -18px; margin-top: -18px; width: 36px; height: 36px; background: linear-gradient(145deg,#5856d6,#af52de); }
  .o4 { top: 100%; left: 50%; margin-left: -19px; margin-top: -38px; width: 38px; height: 38px; background: linear-gradient(145deg,#34c759,#30d158); }
  .o5 { top: 79.3%; left: 9.5%; margin-left: -17px; margin-top: -17px; width: 34px; height: 34px; background: linear-gradient(145deg,#0a84ff,#30b0c7); }
  .o6 { top: 29.3%; left: 9.5%; margin-left: -18px; margin-top: -18px; width: 36px; height: 36px; background: linear-gradient(145deg,#ff9f0a,#ff6c02); }

  /* Positions around ring-2 (radius 130px), on the reverse orbit */
  .o7  { top: 3%;  left: 25%; width: 32px; height: 32px; background: linear-gradient(145deg,#ff453a,#ff9f9c); }
  .o8  { top: 3%;  left: 68%; width: 32px; height: 32px; background: linear-gradient(145deg,#00c7be,#64d2ff); }
  .o9  { top: 92%; left: 68%; width: 32px; height: 32px; background: linear-gradient(145deg,#ffd60a,#ff9f0a); }
  .o10 { top: 92%; left: 25%; width: 32px; height: 32px; background: linear-gradient(145deg,#bf5af2,#5856d6); }

  .bubble-icon { fill: #fff; }
  .o2 .bubble-icon { fill: none; }

  /* Center hero orb — logo removed, replaced with animated glass core */
  .core {
    position: absolute;
    top: 50%; left: 50%;
    width: 96px; height: 96px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 5;
    background: linear-gradient(150deg, #0a84ff, #64d2ff 55%, #bf5af2 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset,
                0 10px 40px rgba(10,132,255,0.45),
                0 0 60px rgba(100,210,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: core-breathe 4s ease-in-out infinite;
  }
  .core::before {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: linear-gradient(160deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%);
  }
  .core::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(100,210,255,0.35);
    animation: ripple 3s ease-out infinite;
  }
  @keyframes core-breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%       { transform: translate(-50%, -50%) scale(1.05); }
  }
  @keyframes ripple {
    0%   { transform: scale(1);   opacity: 0.6; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .core svg {
    width: 38px; height: 38px;
    fill: #fff;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
  }
  .core img {
    width: 62px; height: 62px;
    object-fit: cover;
    border-radius: 50%;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
  }

  /* ══════════ BRAND ══════════ */
  .brand { text-align: center; margin-bottom: 26px; position: relative; z-index: 1; }
  .brand h1 {
    font-size: 38px; font-weight: 800; letter-spacing: -1.2px;
    background: linear-gradient(120deg, #ffffff 20%, #8ecbff 60%, #bf9bff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand p  { font-size: 13.5px; color: var(--label2); margin-top: 5px; letter-spacing: 0.2px; }

  /* ══════════ CARD ══════════ */
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    border-radius: 24px;
    padding: 34px 30px;
    box-shadow: 0 8px 50px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.06) inset;
    border: 1px solid var(--card-border);
    position: relative;
    z-index: 1;
    animation: card-in 0.7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card h2 {
    font-size: 21px; font-weight: 650;
    color: var(--label);
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }
  .card p.sub {
    font-size: 13px; color: var(--label2);
    text-align: center;
    margin-bottom: 24px;
  }

  .field-wrap { position: relative; margin-bottom: 16px; }
  .field-label {
    display: block; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--label2); margin-bottom: 7px;
  }

  input[type=password] {
    width: 100%; height: 48px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid var(--sep);
    border-radius: 13px;
    font-size: 16px; letter-spacing: 3px;
    padding: 0 15px;
    color: var(--label);
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }
  input[type=password]::placeholder { color: rgba(255,255,255,0.25); letter-spacing: 2px; }
  input[type=password]:focus {
    border-color: var(--blue);
    background: rgba(10,132,255,0.08);
    box-shadow: 0 0 0 4px rgba(10,132,255,0.15);
  }
  input[type=password].shake {
    animation: shake 0.4s ease;
    border-color: var(--red);
  }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
  }

  .error-msg {
    font-size: 12px; color: var(--red);
    text-align: center;
    margin-bottom: 10px;
    min-height: 18px;
    transition: opacity 0.3s;
  }

  .btn-signin {
    width: 100%; height: 50px;
    background: linear-gradient(135deg, var(--blue), var(--blue2));
    color: #06131f;
    border: none;
    border-radius: 15px;
    font-family: inherit;
    font-size: 16.5px; font-weight: 700;
    cursor: pointer;
    letter-spacing: -0.1px;
    transition: filter 0.15s, transform 0.1s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 8px 24px rgba(10,132,255,0.35);
  }
  .btn-signin:hover  { filter: brightness(1.08); box-shadow: 0 10px 28px rgba(10,132,255,0.45); }
  .btn-signin:active { transform: scale(0.98); }
  .btn-signin:disabled { background: #48484a; color: #8e8e93; cursor: not-allowed; transform: none; box-shadow: none; }

  /* lockout banner */
  .lockout-banner {
    display: none;
    background: rgba(255,69,58,0.12);
    border: 1px solid rgba(255,69,58,0.3);
    border-radius: 13px;
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 13px;
    color: #ff8a80;
    text-align: center;
    line-height: 1.5;
  }

  .footer-note {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: var(--label2);
    position: relative;
    z-index: 1;
    letter-spacing: 0.3px;
  }
</style>
</head>

  <div class="error-msg" id="errorMsg"></div>

  <div class="field-wrap">
    <label class="field-label" for="pwInput">Password</label>
    <input type="password" id="pwInput" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-signin" id="signinBtn" onclick="doLogin()">Sign In</button>

<script>
// ── Config ──────────────────────────────────────────
const CORRECT_PW   = "042567mm";
const LOCKOUT_MS   = 60 * 60 * 1000;   // 1 hour
const MAX_ATTEMPTS = 5;                 // wrong tries before lockout
const SESSION_KEY  = "gh_session";
const LOCK_KEY     = "gh_lockout";
const ATT_KEY      = "gh_attempts";
// ────────────────────────────────────────────────────

// ── Check existing session ───────────────────────────
(function init() {
  // Check lockout
  if (isLocked()) { showLockout(); return; }

  // Check valid session cookie
  const sess = getCookie(SESSION_KEY);
  if (sess === "ok") { goApp(); return; }
})();

// ── Login function ───────────────────────────────────
function doLogin() {
  if (isLocked()) { showLockout(); return; }

  const pw = document.getElementById("pwInput").value;

  if (pw === CORRECT_PW) {
    // Correct — set session (expires in 24h)
    setCookie(SESSION_KEY, "ok", 1);
    localStorage.removeItem(ATT_KEY);
    localStorage.removeItem(LOCK_KEY);
    goApp();
  } else {
    // Wrong password
    let attempts = parseInt(localStorage.getItem(ATT_KEY) || "0") + 1;
    localStorage.setItem(ATT_KEY, attempts);

    const input = document.getElementById("pwInput");
    input.classList.add("shake");
    setTimeout(() => input.classList.remove("shake"), 400);

    if (attempts >= MAX_ATTEMPTS) {
      const lockUntil = Date.now() + LOCKOUT_MS;
      localStorage.setItem(LOCK_KEY, lockUntil);
      localStorage.removeItem(ATT_KEY);
      showLockout();
    } else {
      const left = MAX_ATTEMPTS - attempts;
      document.getElementById("errorMsg").textContent =
        `Incorrect password. ${left} attempt${left !== 1 ? "s" : ""} remaining.`;
    }
  }
}

// ── Lockout ──────────────────────────────────────────
function isLocked() {
  const lockUntil = localStorage.getItem(LOCK_KEY);
  if (!lockUntil) return false;
  if (Date.now() < parseInt(lockUntil)) return true;
  localStorage.removeItem(LOCK_KEY);
  return false;
}

function showLockout() {
  const lockUntil = parseInt(localStorage.getItem(LOCK_KEY));
  const remainMin = Math.ceil((lockUntil - Date.now()) / 60000);

  document.getElementById("lockoutBanner").style.display = "block";
  document.getElementById("signinBtn").disabled = true;
  document.getElementById("pwInput").disabled = true;
  document.getElementById("errorMsg").textContent = "";

  function updateTimer() {
    const remain = lockUntil - Date.now();
    if (remain <= 0) {
      localStorage.removeItem(LOCK_KEY);
      location.reload();
      return;
    }
    const m = Math.floor(remain / 60000);
    const s = Math.floor((remain % 60000) / 1000);
    document.getElementById("lockoutBanner").innerHTML =
      `🔒 Too many failed attempts.<br>Please wait <strong>${m}m ${s}s</strong> before trying again.`;
    setTimeout(updateTimer, 1000);
  }
  updateTimer();
}

// ── Cookie helpers ───────────────────────────────────
function setCookie(name, val, days) {
  const exp = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${val}; expires=${exp}; path=/; SameSite=Strict`;
}
function getCookie(name) {
  return document.cookie.split("; ").reduce((acc, c) => {
    const [k, v] = c.split("=");
    return k === name ? v : acc;
  }, "");
}

<!-- Online / Offline Status -->
<script>
  (function() {
    const dot = document.getElementById('netStatus');
    const text = document.getElementById('netStatusText');
    function updateNetStatus() {
      if (!dot || !text) return;
      if (navigator.onLine) {
        dot.classList.remove('net-offline');
        dot.classList.add('net-online');
        text.textContent = 'Online';
      } else {
        dot.classList.remove('net-online');
        dot.classList.add('net-offline');
        text.textContent = 'Offline';
      }
    }
    window.addEventListener('online', updateNetStatus);
    window.addEventListener('offline', updateNetStatus);
    updateNetStatus();
  })();
</script>

<!-- Add to Home Screen / Install Prompt -->
<script>
  (function() {
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    }

    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    }

    if (isStandalone()) {
      if (installBtn) installBtn.style.display = 'none';
    } else {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.style.display = 'flex';
      });

      if (isIOS() && installBtn) {
        installBtn.style.display = 'flex';
      }

      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        if (installBtn) installBtn.style.display = 'none';
      });

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            if (outcome === 'accepted') installBtn.style.display = 'none';
          } else if (isIOS()) {
            alert('Install GenHub:\n\n1. Tap the Share icon (square with arrow) in Safari\n2. Scroll down and tap "Add to Home Screen"\n3. Tap "Add" to confirm');
          } else {
            alert('To install: open your browser menu and select "Install App" or "Add to Home Screen".');
          }
        });
      }
    }
  })();
</script>
