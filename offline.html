<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GenHub – Offline</title>
<meta name="theme-color" content="#0b0b12">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    background:#0f1020;
    font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
    color:#f5f5f7;
  }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:24px; text-align:center;
    background:
      radial-gradient(circle at 15% 15%, rgba(10,132,255,0.25), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(175,82,222,0.20), transparent 45%),
      linear-gradient(160deg, #0f1020, #1a1530);
  }
  .icon-wrap {
    width:88px; height:88px; border-radius:24px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:24px;
  }
  svg { width:40px; height:40px; }
  h1 { font-size:22px; font-weight:700; margin-bottom:10px; }
  p { font-size:14px; color:#a1a1ab; max-width:280px; line-height:1.5; margin-bottom:28px; }
  button {
    padding:14px 28px; border-radius:14px; border:none;
    background:#0a84ff; color:#fff; font-size:15px; font-weight:600;
    cursor:pointer;
  }
  button:active { transform:scale(0.97); }
  .status {
    margin-top:20px; font-size:12px; color:#64d2ff;
    display:flex; align-items:center; gap:6px;
  }
  .dot { width:8px; height:8px; border-radius:50%; background:#ff453a; }
</style>
</head>
<body>
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="#64d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>GenHub can't reach the network right now. Check your connection and try again.</p>
  <button onclick="location.reload()">Retry</button>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Offline</span></div>

  <script>
    function updateStatus() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (navigator.onLine) {
        dot.style.background = '#34c759';
        text.textContent = 'Back online — tap Retry';
      } else {
        dot.style.background = '#ff453a';
        text.textContent = 'Offline';
      }
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
